syntax = "proto3";

package diagnostic;

enum Severity {
  UNKNOWN = 0;
  ERROR = 1;
  WARNING = 2;
  INFO = 3;
}

message Diagnostic {
  string file = 1;
  int32 line = 2;
  Severity severity = 3;
  string message = 4;
}

message DiagnosticRequest {
  string file = 1;
  string contents = 2;
}

message DiagnosticResponse {
  repeated Diagnostic diagnostics = 1;
}
